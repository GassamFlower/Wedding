<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大喜的日子 · 小程序端画布预览</title>
    <style>
        :root {
            --bg-primary: #FFF9F2;
            --bg-card: #FFFFFF;
            --gold: #D4AF37;
            --gold-light: #F5E6C8;
            --gold-50: #FDF8EF;
            --gold-100: #FBF0D9;
            --gold-200: #F5E6C8;
            --gold-300: #E8D5A3;
            --gold-400: #D4AF37;
            --gold-500: #C09A2E;
            --gold-600: #A07D22;
            --gold-700: #7D6019;
            --gold-800: #5C4512;
            --gold-900: #3D2C0A;
            --text-primary: #2C2C2C;
            --text-secondary: #8C8C8C;
            --text-hint: #BFBFBF;
            --gradient-gold: linear-gradient(135deg, #D4AF37 0%, #E8C86A 100%);
            --gradient-warm: linear-gradient(180deg, #FFF9F2 0%, #FFFFFF 100%);
            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.10);
            --shadow-btn: 0 2px 4px rgba(212, 175, 55, 0.2);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 20px;
            --font-display: 'Georgia', 'Playfair Display', 'Noto Serif SC', 'STSong', 'SimSun', serif;
            --font-body: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', -apple-system, sans-serif;
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0ebe0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* ── 画布容器（模拟手机） ── */
        .canvas-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            max-width: 1400px;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: var(--bg-primary);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18), 0 0 0 8px #1a1a1a, 0 0 0 10px #333;
            position: relative;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .phone-frame.wide {
            width: 420px;
        }
        .phone-label {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .phone-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* ── 状态栏 ── */
        .status-bar {
            height: 48px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
        }
        .status-bar.light {
            color: #fff;
        }
        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 11px;
        }

        /* ── 导航栏 ── */
        .nav-bar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            flex-shrink: 0;
            position: relative;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            background: rgba(255, 249, 242, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid transparent;
        }
        .nav-bar .back-btn {
            position: absolute;
            left: 12px;
            font-size: 18px;
            color: var(--gold-600);
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .nav-bar .back-btn:hover {
            background: var(--gold-100);
        }
        .nav-bar .action-btn {
            position: absolute;
            right: 16px;
            font-size: 13px;
            color: var(--gold-600);
            cursor: pointer;
            font-weight: 500;
        }

        /* ── 滚动内容区 ── */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-area::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-area::-webkit-scrollbar-thumb {
            background: var(--gold-200);
            border-radius: 10px;
        }

        /* ── Tab Bar ── */
        .tab-bar {
            height: 60px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid var(--gold-200);
            flex-shrink: 0;
            padding-bottom: 4px;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            font-size: 10px;
            color: var(--text-secondary);
            transition: all 0.2s;
            padding: 4px 10px;
            border-radius: 8px;
        }
        .tab-item.active {
            color: var(--gold-600);
            font-weight: 600;
        }
        .tab-icon {
            font-size: 20px;
            line-height: 1;
        }

        /* ── 卡片 ── */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--gold-200);
            transition: all 0.2s var(--ease-smooth);
            cursor: pointer;
        }
        .card:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-hover);
        }

        /* ── 按钮 ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 500;
            transition: all 0.2s var(--ease-smooth);
            border-radius: var(--radius-md);
            white-space: nowrap;
            user-select: none;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--gradient-gold);
            color: #fff;
            box-shadow: var(--shadow-btn);
            padding: 10px 20px;
            font-size: 14px;
        }
        .btn-secondary {
            background: var(--gold-100);
            color: var(--gold-700);
            padding: 10px 20px;
            font-size: 14px;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--gold-400);
            color: var(--gold-600);
            padding: 9px 19px;
            font-size: 13px;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }
        .btn-lg {
            padding: 14px 28px;
            font-size: 16px;
            border-radius: var(--radius-md);
        }
        .btn-full {
            width: 100%;
            justify-content: center;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ── 标签 ── */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            background: var(--gold-100);
            color: var(--gold-600);
            white-space: nowrap;
        }
        .tag.active {
            background: var(--gold-400);
            color: #fff;
        }
        .tag-pill {
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 12px;
        }

        /* ── 输入框 ── */
        .input-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--gold-200);
            border-radius: var(--radius-xl);
            padding: 8px 14px;
            gap: 8px;
            transition: border-color 0.2s;
        }
        .input-wrap:focus-within {
            border-color: var(--gold-400);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08);
        }
        .input-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-primary);
            background: transparent;
            font-family: var(--font-body);
        }
        .input-wrap input::placeholder {
            color: var(--text-hint);
        }
        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gradient-gold);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .send-btn:active {
            transform: scale(0.9);
        }

        /* ── 对话气泡 ── */
        .chat-bubble {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
            animation: bubbleIn 0.3s var(--ease-smooth);
        }
        @keyframes bubbleIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .bubble-ai {
            background: #FDF8EF;
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid var(--gold-100);
        }
        .bubble-user {
            background: var(--gradient-gold);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        /* ── 案例网格 ── */
        .case-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .case-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--gold-100);
            cursor: pointer;
            transition: all 0.2s;
        }
        .case-card:active {
            transform: scale(0.97);
        }
        .case-cover {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 36px;
            color: rgba(255, 255, 255, 0.6);
        }
        .case-cover .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: var(--gold-700);
            font-weight: 500;
        }
        .case-info {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .case-info .title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .case-info .meta {
            font-size: 11px;
            color: var(--gold-500);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .case-info .tags-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .case-info .mini-tag {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            background: var(--gold-50);
            color: var(--gold-600);
        }

        /* ── 筛选标签行 ── */
        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }
        .filter-row::-webkit-scrollbar {
            display: none;
        }
        .filter-chip {
            flex-shrink: 0;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: var(--gold-50);
            color: var(--gold-600);
            border: 1px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-chip.active {
            background: var(--gradient-gold);
            color: #fff;
            box-shadow: var(--shadow-btn);
            border-color: transparent;
        }

        /* ── Hero 区 ── */
        .hero-section {
            background: linear-gradient(135deg, #FDF8EF 0%, #FBF0D9 40%, #FDF8EF 100%);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero-section::after {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
        }
        .hero-title {
            font-family: var(--font-display);
            font-size: 22px;
            color: var(--gold-800);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        .hero-sub {
            font-size: 12px;
            color: var(--gold-500);
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }
        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
            position: relative;
            z-index: 1;
        }
        .hero-stat {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(6px);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--gold-600);
        }
        .hero-stat strong {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--gold-700);
        }

        /* ── 数据卡片 ── */
        .stat-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 14px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--gold-100);
            text-align: center;
        }
        .stat-card .num {
            font-family: var(--font-display);
            font-size: 26px;
            color: var(--gold-600);
            font-weight: 700;
        }
        .stat-card .lbl {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ── 列表项 ── */
        .list-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .list-item:active {
            background: var(--gold-50);
            border-color: var(--gold-100);
        }
        .list-item .li-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: var(--gold-100);
        }
        .list-item .li-content {
            flex: 1;
            min-width: 0;
        }
        .list-item .li-title {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .list-item .li-sub {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .list-item .li-arrow {
            color: var(--gold-400);
            font-size: 14px;
        }

        /* ── 进度条 ── */
        .progress-bar {
            height: 6px;
            background: var(--gold-100);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--gradient-gold);
            border-radius: 3px;
            transition: width 0.5s var(--ease-smooth);
        }

        /* ── 日历 ── */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.15s;
        }
        .cal-cell.has-event::after {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--gold-400);
            margin-top: 1px;
        }
        .cal-cell.today {
            background: var(--gold-400);
            color: #fff;
            font-weight: 700;
        }
        .cal-cell.today::after {
            background: #fff;
        }
        .cal-header {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 4px 0;
        }

        /* ── 用户头像区 ── */
        .user-header {
            background: linear-gradient(135deg, #D4AF37 0%, #E8C86A 50%, #D4AF37 100%);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #fff;
        }
        .avatar-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* ── 骨架屏 ── */
        .skeleton {
            background: linear-gradient(90deg, #f5f0e8 25%, #fdf8ef 50%, #f5f0e8 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ── Toast ── */
        .toast {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 44, 44, 0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 100;
            pointer-events: none;
            animation: toastIn 0.3s var(--ease-smooth);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ── 页脚提示 ── */
        .footer-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-hint);
            padding: 8px;
        }

        /* ── 倒计时大数字 ── */
        .countdown-big {
            font-family: var(--font-display);
            font-size: 64px;
            color: var(--gold-600);
            font-weight: 700;
            text-align: center;
            line-height: 1;
        }

        /* ── 响应式 ── */
        @media (max-width: 900px) {
            .canvas-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 40px;
            }
            .phone-frame {
                width: 360px;
                height: 780px;
                border-radius: 30px;
            }
        }

        /* 页面切换按钮 */
        .page-switcher {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 4px;
        }
        .page-switcher button {
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
            font-family: var(--font-body);
        }
        .page-switcher button.active-switch {
            background: var(--gold-400);
            color: #fff;
            border-color: var(--gold-400);
        }
    </style>
</head>
<body>

    <div class="canvas-wrapper" id="app">

        <!-- ═══════════════ 手机1：新人端 ═══════════════ -->
        <div class="phone-col">
            <div class="page-switcher" id="newcomerSwitcher">
                <button class="active-switch" data-page="chat">AI对话</button>
                <button data-page="cases">案例馆</button>
                <button data-page="profile">我的</button>
                <button data-page="detail">案例详情</button>
                <button data-page="budget">预算计算器</button>
                <button data-page="checklist">筹备清单</button>
                <button data-page="countdown">倒计时</button>
            </div>
            <div class="phone-label">👰 新人端</div>
            <div class="phone-frame" id="newcomerPhone">
                <div class="status-bar">
                    <span>9:41</span>
                    <span class="status-icons">📶 🔋</span>
                </div>
                <div id="newcomerContent"></div>
            </div>
        </div>

        <!-- ═══════════════ 手机2：策划师端 ═══════════════ -->
        <div class="phone-col">
            <div class="page-switcher" id="plannerSwitcher">
                <button class="active-switch" data-page="dashboard">工作台</button>
                <button data-page="orders">订单看板</button>
                <button data-page="calendar">排期日历</button>
                <button data-page="contracts">合同管理</button>
                <button data-page="props">道具管理</button>

        function renderNewcomerPage(pageName) {
            if (newcomerPages[pageName]) {
                newcomerPhone.innerHTML = newcomerPages[pageName]();
            }
        }

        function renderPlannerPage(pageName) {
            if (plannerPages[pageName]) {
                plannerPhone.innerHTML = plannerPages[pageName]();
            }

            if (e.target.tagName === 'BUTTON') {
                const page = e.target.dataset.page;
                document.querySelectorAll('#newcomerSwitcher button').forEach(b => b.classList.remove(
                    'active-switch'));
                e.target.classList.add('active-switch');
                renderNewcomerPage(page);
            }
        });

        // 策划师端切换
        document.getElementById('plannerSwitcher').addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                const page = e.target.dataset.page;
                document.querySelectorAll('#plannerSwitcher button').forEach(b => b.classList.remove(
                    'active-switch'));
                e.target.classList.add('active-switch');
                renderPlannerPage(page);
            }
        });

        // 点击反馈动画
        document.addEventListener('click', function(e) {
            const card = e.target.closest('.card');
            const btn = e.target.closest('.btn');
            const chip = e.target.closest('.filter-chip');
            if (card || btn) {
                const el = card || btn;
                el.style.transform = 'scale(0.97)';
                setTimeout(() => { el.style.transform = ''; }, 150);
            }
            if (chip && !chip.classList.contains('active')) {
                const row = chip.parentElement;
                row.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            }
        });
